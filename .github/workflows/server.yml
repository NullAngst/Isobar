name: Build server images

# Builds the Isobar Server images (relay, geocoding, radar) and pushes them to
# GitHub's container registry, only when run by hand: Actions, "Build server
# images", "Run workflow", then pick a tag under "Use workflow from". The
# release must already exist for that tag (make it on the Releases page
# first). Pushes to main and pull requests only run the checks. Pushing a tag
# does nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Server checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tests that need pyIEM (NWWS-OI parsing, the IEM fallback) skip
      # without it; the image build below installs everything.
      - name: Install what the relay tests need
        run: python -m pip install aiohttp shapely

      - name: Run the relay tests
        working-directory: Server/relay
        run: python -m unittest discover -s tests -t . -v

      - name: Check the relay compiles
        run: python -m compileall -q Server/relay/isobar_relay

      - name: Shellcheck the server scripts
        run: shellcheck Server/radar/mrms.sh Server/geocoding/install.sh Server/geocoding/entrypoint.sh

      - name: Check compose.yml parses
        working-directory: Server
        run: |
          touch keys.txt
          CONTACT_EMAIL=ci@example.net docker compose -f compose.yml config --quiet
          rm keys.txt

      # On a tag, the versions have to match before anything is built.
      - name: Check the tag matches the version
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
        run: |
          app="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' isobar/__init__.py)"
          relay="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' Server/relay/isobar_relay/__init__.py)"
          tag="${GITHUB_REF_NAME#[vV]}"
          if [ "$tag" != "$app" ] || [ "$tag" != "$relay" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version ($app) and the relay version ($relay). Bump both, or pick the right tag."
            exit 1
          fi

  images:
    name: Build and push ${{ matrix.image }}
    needs: checks
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: isobar-relay
            context: Server/relay
          - image: isobar-geocoding
            context: Server/geocoding
          - image: isobar-radar
            context: Server/radar
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check this run is for a tag with a release
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::This run is on the branch '$GITHUB_REF_NAME', not a tag, so nothing is pushed. To release the server images, make the release and tag on the Releases page, then run this workflow and pick that tag under 'Use workflow from'."
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::No release exists for tag $GITHUB_REF_NAME yet. Make it on the Releases page (Draft a new release, pick this tag, Publish), then run this workflow again on the tag."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@v4

      - name: Log in to the GitHub container registry
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          name="ghcr.io/$owner/${{ matrix.image }}"
          echo "IMAGE=$name" >> "$GITHUB_ENV"
          # --pull so the untagged base images are always the newest.
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$GITHUB_REF_NAME" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$name:latest" -t "$name:$GITHUB_REF_NAME" "${{ matrix.context }}"

      - name: Smoke test the relay
        if: matrix.image == 'isobar-relay'
        run: |
          docker run --rm "$IMAGE:latest" python -c "import isobar_relay.app, isobar_relay.nwws, pyiem.nws.products, nwws_receiver, geopandas; print('relay imports fine')"

      - name: Push
        # latest is what compose.yml runs. The version tag is only there for a
        # manual rollback after a bad release.
        run: |
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:latest"
