name: Build and release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Linux libraries Qt needs at build time
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libasound2

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check the sources compile
        run: python -m compileall -q isobar run.py

      - name: Build
        run: pyinstaller --noconfirm --clean isobar.spec

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./dist/Isobar/Isobar --version

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "Isobar-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" Isobar

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Isobar -DestinationPath "Isobar-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Isobar.app "Isobar-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Isobar-${{ matrix.name }}
          path: |
            Isobar-*.tar.gz
            Isobar-*.zip
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Isobar-*.tar.gz
            Isobar-*.zip

  android:
    name: Build android-apk
    # Pinned rather than ubuntu-latest, so the image only changes when we say so.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy compiles the Python side with a Python on the build machine,
      # and its minor version has to match the app's (3.12, see android/app/build.gradle.kts).
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # cache-provider: basic keeps caching on the open-source implementation
      # (a wrapper over actions/cache). v6 defaults to a proprietary service.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing. See 'Signing the Android app' in the README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/isobar-release.jks"
          echo "ISOBAR_KEYSTORE=$RUNNER_TEMP/isobar-release.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK
        working-directory: android
        env:
          ISOBAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ISOBAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ISOBAR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Check the signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "Isobar-${{ github.ref_name }}-android.apk"

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/isobar-release.jks"

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Isobar-android
          path: Isobar-*-android.apk
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: Isobar-*-android.apk
