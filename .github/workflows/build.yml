name: Build and release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux libraries Qt needs at build time
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libasound2

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check the sources compile
        run: python -m compileall -q isobar run.py

      - name: Build
        run: pyinstaller --noconfirm --clean isobar.spec

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./dist/Isobar/Isobar --version

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "Isobar-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" Isobar

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Isobar -DestinationPath "Isobar-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Isobar.app "Isobar-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Isobar-${{ matrix.name }}
          path: |
            Isobar-*.tar.gz
            Isobar-*.zip
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Isobar-*.tar.gz
            Isobar-*.zip
