name: Build and release

on:
  release:
    types: [published]
  workflow_dispatch:

# Every job reads only. The release job at the bottom is the one place that
# can write, and it only uploads files the other jobs already built.
permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the one dependency the tests need
        run: python -m pip install requests

      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux libraries Qt needs at build time
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libasound2

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check the sources compile
        run: python -m compileall -q isobar run.py

      - name: Build
        run: pyinstaller --noconfirm --clean isobar.spec

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./dist/Isobar/Isobar --version

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "Isobar-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" Isobar

      - name: Build the AppImage (Linux)
        if: runner.os == 'Linux'
        # Called through bash, since a web UI upload drops the execute bit.
        run: bash packaging/appimage/build-appimage.sh "${{ github.ref_name }}"

      - name: Smoke test the AppImage (Linux)
        if: runner.os == 'Linux'
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./Isobar-*-linux-x86_64.AppImage --version

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Isobar -DestinationPath "Isobar-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Isobar.app "Isobar-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Isobar-${{ matrix.name }}
          path: |
            Isobar-*.tar.gz
            Isobar-*.zip
            Isobar-*.AppImage
            Isobar-*.AppImage.zsync
          if-no-files-found: error

  android:
    name: Build android-apk
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy compiles the Python side with a Python on the build machine,
      # and its minor version has to match the app's (3.12, see android/app/build.gradle.kts).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing. See 'Signing the Android app' in the README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/isobar-release.jks"
          echo "ISOBAR_KEYSTORE=$RUNNER_TEMP/isobar-release.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK
        working-directory: android
        env:
          ISOBAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ISOBAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ISOBAR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Check the signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "Isobar-${{ github.ref_name }}-android.apk"

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/isobar-release.jks"

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Isobar-android
          path: Isobar-*-android.apk
          if-no-files-found: error

  release:
    name: Attach to the release
    needs: [build, android]
    # Runs when a release is published, even if one build failed (a missing
    # Android signing key, say), so whatever did build still gets attached.
    if: github.event_name == 'release' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect the builds
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Attach them
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
